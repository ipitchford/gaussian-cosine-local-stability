name: Finite diagnostic replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -B reproduce.py "$RUNNER_TEMP/fresh-diagnostics"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-receipts
          path: ${{ runner.temp }}/fresh-diagnostics
